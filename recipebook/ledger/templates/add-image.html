{% extends 'base.html' %}
{% load static %}

{% block title %} Upload Image {% endblock %}
{% block content %}
    {% if request.user.is_authenticated %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Submit</button>
        </form>
    {% else %}
        <p>You do not have permission to view this page. Log in first.</p>
    {% endif %}
    <a href="{% url 'ledger:recipe' pk %}">Back</a>
{% endblock %}
